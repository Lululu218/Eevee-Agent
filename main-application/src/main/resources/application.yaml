server:
  # 端口
  port: 9090
  # Tomcat 配置
  tomcat:
    # 最大请求头大小（单位：字节）
    max-http-header-size: 81920

#---Sa-Token 配置---
sa-token:
  # --token 名称（同时也是 cookie 名称）
  token-name: satoken
  # --token 有效期一天（单位：秒）
  timeout: 86400
  # --token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # --是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # --在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # --token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # --是否输出操作日志
  is-log: true

#---Spring配置---
spring:
  application:
    name: core-framework
  servlet:
    # --文件上传大小限制
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  #---MySQL数据配置---(暂定本地数据库、可迁移至docker)
  datasource:
    url: jdbc:mysql://192.168.191.128:3306/eeveeagent?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 192.168.191.128
      port: 6379
      password: 123456

#---Mybatis-Plus配置---
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.azheng.framework.user.entity
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl



langchain4j:
  #---百炼平台-通义千问核心配置---
  community:
    dashscope:
      api-key: ${BAILIAN_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      dimensions: 768
      rerank-model-name: qwen3-rerank
  # --OpenAI
  open-ai:

#---Milvus 向量数据库配置---
milvus:
  uri: http://192.168.191.128:19530
  dbname: eevee_agent
  connectTimeout: 5000
  keepAliveTime: 30000
  idleTimeout: 60000


#---RustFS 对象存储配置---
rustfs:
  url: http://192.168.191.128:9000
  # --账号密码
  access-key-id: rustfsadmin
  secret-access-key: rustfsadmin

intent:
  topk: 30


# AI系统配置：RAG、多模型容错、向量化
ai:
  # 默认路由策略: PRIORITY / ROUND_ROBIN / FAILOVER / LOAD_BALANCE
  default-strategy: PRIORITY

  # 熔断配置开关
  circuit-breaker-enabled: true
  retry-enabled: true
  rate-limiter-enabled: true

  #全局向量化维度
  dimensions: 2048

  #1. 硅基流动（聚合平台：DeepSeek / Kimi / BGE）主模型
  silicon-flow:
      order: 1
      enabled: true
      api-key: ${SILICONFLOW_API_KEY}
      base-url: https://api.siliconflow.cn/v1
      stream-model: deepseek-ai/DeepSeek-V4-Flash
      background-model: deepseek-ai/DeepSeek-V3.2
      embedding-model: Pro/BAAI/bge-m3
      rate-limit: 200

  #2. 阿里百炼（备用）
  bai-lian:
    order: 2
    enabled: true
    api-key: ${BAILIAN_API_KEY}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    stream-model: qwen-flash
    background-model: qwen-turbo
    embedding-model: text-embedding-v4
    rate-limit: 100

  #3. 智谱AI（GLM 系列 兜底）
  zhi-pu:
    order: 3
    enabled: true
    api-key: ${GLM_API_KEY}
    base-url: https://open.bigmodel.cn/api/paas/v4
    stream-model: glm-4v-flashx
    background-model: glm-4-air-250414
    embedding-model: embedding-3
    rate-limit: 100

  #多路检索配置
  search:
    channels:
      vector-global:
        confidence-threshold: 0.6
        top-k-multiplier: 3
      intent-directed:
        min-intent-score: 0.4
        top-k-multiplier: 2

#resilience4j熔断机制
resilience4j:
  circuitbreaker:
    configs:
      default:
        # 滑动窗口大小
        sliding-window-size: 100
        # 失败率阈值（超过此值触发熔断）
        failure-rate-threshold: 50
        # 熔断开启时间（秒）
        wait-duration-in-open-state: 60000
        # 半开状态下允许的请求数
        permitted-number-of-calls-in-half-open-state: 10
        # 忽略的异常类型
        ignore-exceptions:
          - com.azheng.framework.exception.ClientException

  retry:
    configs:
      default:
        # 最大重试次数
        max-attempts: 2
        # 重试间隔（毫秒）
        wait-duration: 1000

  ratelimiter:
    configs:
      default:
        # 限流速率（每秒）
        limit-for-period: 100
        # 限流周期
        limit-refresh-period: 1s
        # 超时等待时间
        timeout-duration: 5000ms